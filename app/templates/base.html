<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        Examination Seat Allocator
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <nav class="navbar navbar-dark bg-primary shadow-sm">
<a
    class="btn btn-outline-light btn-sm"
    href="{{ url_for('main.admin_eligibility') }}"
>
    Eligibility
</a>
<a
    class="btn btn-outline-light btn-sm"
    href="{{ url_for('main.admin_examinations') }}"
>
    Examinations
</a>
        <div class="container">
            <a
                class="navbar-brand fw-semibold"
                href="{{ url_for('main.home') }}"
            >
                Examination Seat Allocator
            </a>

            <div class="d-flex gap-2">
<a
    class="btn btn-outline-light btn-sm"
    href="{{ url_for('main.admin_allocations') }}"
>
    Allocations
</a>
<a
    class="btn btn-outline-light btn-sm"
    href="{{ url_for('main.admin_subjects') }}"
>
    Subjects
</a>
                <a
                    class="btn btn-light btn-sm"
                    href="{{ url_for('main.admin_import') }}"
                >
                    Import Data
                </a>

                <a
                    class="btn btn-outline-light btn-sm"
                    href="{{ url_for('main.admin_rooms') }}"
                >
                    Room Management
                </a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
